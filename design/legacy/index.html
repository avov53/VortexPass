<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VortexPass · Дизайн</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#home"><span class="brand-symbol">V</span><span>VortexPass</span></a>
    <button class="new-session" id="new-session"><span>＋</span> Новое подключение</button>
    <div class="nav-label">Рабочее пространство</div>
    <nav aria-label="Основная навигация">
      <button class="nav-item active" data-page="home"><span class="nav-icon">◉</span> Подключение</button>
      <button class="nav-item" data-page="profiles"><span class="nav-icon">▦</span> Профили</button>
      <button class="nav-item" data-page="warp"><span class="nav-icon">◎</span> Cloudflare WARP</button>
      <button class="nav-item" data-page="activity"><span class="nav-icon">≡</span> Журнал</button>
    </nav>
    <div class="sidebar-note"><span class="tiny-dot"></span> Всё работает на вашем компьютере</div>
    <div class="sidebar-bottom">
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span> Настройки</button>
      <div class="identity"><div class="avatar">V</div><div><strong>Локальное пространство</strong><small>VortexPass для Windows</small></div><span class="more">···</span></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="topbar-left"><button class="icon-button" id="menu-toggle" aria-label="Свернуть боковую панель" aria-expanded="true"><span class="menu-glyph" aria-hidden="true">☰</span></button><span id="page-title">Подключение</span><span class="chevron">⌄</span></div><div class="prototype-label">Предпросмотр дизайна</div><button class="icon-button theme-button" id="theme-toggle" aria-label="Переключить тему">☀</button></header>
    <main id="content"></main>
    <footer>Демонстрационный интерфейс · сетевые настройки не применяются</footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
